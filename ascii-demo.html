/* ===== nastavenia ===== */
const COLS = 340;              // znakov na riadok — detail
const FONT = 5;                // px

/* obdĺžnik tváre (Vision, normalizované súradnice, origin vľavo hore),
   rozšírený o okraj na vlasy a bradu */
const FACE = (() => {
  const r = {x:0.3341, y:0.1985, w:0.2548, h:0.2428};
  const mx = r.w * 0.30, my = r.h * 0.35;
  return { x:r.x-mx, y:r.y-my, w:r.w+2*mx, h:r.h+2*my };
})();
const CELL_W = FONT * 0.6;
const CELL_H = FONT;
const FPS = 14;

/* znakové sady podľa hustoty (husté → riedke), viac kandidátov = scramble */
const SUBJ_LEVELS = [
  "@@MM", "WWBB", "NN88", "QQ00", "DDKR", "GGHE", "UUZP", "wwmy",
  "kkhb", "xxuv", "oocs", "jjtr", "==+~", "::i!", ",,''", "  . "
];
const BACK_LEVELS = [
  "#$&@", "%08X", "?*+=", "/|;\\", ":~-,", "..'`", "    ", "    "
];

/* ===== stav ===== */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let paletteIdx = 0;
let paused = false;
let cells = [];        // {x,y,subj:bool,face:bool,lum:0..1,jit:int}
let subjCells = [], backCells = [];
let ROWS = 0;
let glitch = { until:0, rows:[], shift:0 };

const hex2rgb = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const lerp = (a,b,t) => a+(b-a)*t;
const mulberry = s => { let t = s += 0x6D2B79F5; t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61); return ((t ^ t>>>14)>>>0)/4294967296; };

function gradColor(stops, t){
  const seg = stops.length - 1;
  const s = (t % 1) * seg;
  const i = Math.floor(s), f = s - i;
  const a = hex2rgb(stops[i]), b = hex2rgb(stops[(i+1)%stops.length]);
  return `rgb(${a.map((v,k)=>Math.round(lerp(v,b[k],f))).join(",")})`;
}

/* ===== príprava mriežky z fotky + masky ===== */
function buildGrid(photo, mask){
  const ar = photo.height / photo.width;
  ROWS = Math.round(COLS * ar * (CELL_W / CELL_H));

  const off = document.createElement("canvas");
  off.width = COLS; off.height = ROWS;
  const octx = off.getContext("2d", { willReadFrequently:true });

  octx.drawImage(photo, 0, 0, COLS, ROWS);
  const pd = octx.getImageData(0, 0, COLS, ROWS).data;
  octx.drawImage(mask, 0, 0, COLS, ROWS);
  const md = octx.getImageData(0, 0, COLS, ROWS).data;

  /* luminancia do plochého poľa */
  const lums = new Float32Array(COLS * ROWS);
  const subjFlags = new Uint8Array(COLS * ROWS);
  for (let i = 0; i < COLS * ROWS; i++){
    const p = i * 4;
    lums[i] = 0.2126*pd[p] + 0.7152*pd[p+1] + 0.0722*pd[p+2];
    subjFlags[i] = md[p] > 128 ? 1 : 0;
  }

  /* unsharp mask — lokálny kontrast (oči, brada, vlasy) */
  const blur = new Float32Array(COLS * ROWS);
  const R = 2;
  for (let y = 0; y < ROWS; y++){
    for (let x = 0; x < COLS; x++){
      let sum = 0, n = 0;
      for (let dy = -R; dy <= R; dy++){
        const yy = y + dy;
        if (yy < 0 || yy >= ROWS) continue;
        for (let dx = -R; dx <= R; dx++){
          const xx = x + dx;
          if (xx < 0 || xx >= COLS) continue;
          sum += lums[yy*COLS + xx]; n++;
        }
      }
      blur[y*COLS + x] = sum / n;
    }
  }
  for (let i = 0; i < lums.length; i++){
    lums[i] = Math.min(255, Math.max(0, lums[i] + (lums[i] - blur[i]) * 1.15));
  }

  /* percentilový stretch pre pozadie */
  const backSorted = [];
  for (let i = 0; i < lums.length; i++) if (!subjFlags[i]) backSorted.push(lums[i]);
  backSorted.sort((a,b)=>a-b);
  const bLo = backSorted[Math.floor(backSorted.length*0.03)] || 0;
  const bHi = backSorted[Math.floor(backSorted.length*0.97)] || 255;

  /* ekvalizácia histogramu LEN pre postavu — tmavá košeľa inak zožerie
     celý rozsah a na tvár zostane pár úrovní; tvár má navyše VLASTNÚ
     ekvalizáciu počítanú len z jej pixelov */
  const inFace = (x, y) => {
    const nx = x / COLS, ny = y / ROWS;
    return nx >= FACE.x && nx <= FACE.x + FACE.w && ny >= FACE.y && ny <= FACE.y + FACE.h;
  };
  const histS = new Float32Array(256), histF = new Float32Array(256);
  let nS = 0, nF = 0;
  for (let y = 0; y < ROWS; y++){
    for (let x = 0; x < COLS; x++){
      const i = y*COLS + x;
      if (!subjFlags[i]) continue;
      const b = Math.min(255, Math.round(lums[i]));
      histS[b]++; nS++;
      if (inFace(x, y)){ histF[b]++; nF++; }
    }
  }
  const cdfS = new Float32Array(256), cdfF = new Float32Array(256);
  let aS = 0, aF = 0;
  for (let b = 0; b < 256; b++){
    aS += histS[b]; cdfS[b] = aS / Math.max(1, nS);
    aF += histF[b]; cdfF[b] = aF / Math.max(1, nF);
  }

  cells = [];
  for (let y = 0; y < ROWS; y++){
    for (let x = 0; x < COLS; x++){
      const i = y*COLS + x;
      const face = subjFlags[i] && inFace(x, y);
      let v;
      if (face){
        const b = Math.min(255, Math.round(lums[i]));
        v = 0.75*cdfF[b] + 0.25*(lums[i] / 255);   // tvár: agresívna lokálna ekvalizácia
      } else if (subjFlags[i]){
        const b = Math.min(255, Math.round(lums[i]));
        v = 0.55*cdfS[b] + 0.45*(lums[i] / 255);
      } else {
        v = (lums[i] - bLo) / Math.max(1, bHi - bLo);
      }
      v = Math.min(1, Math.max(0, v));
      cells.push({ x, y, subj: !!subjFlags[i], face, lum: v, jit: Math.floor(mulberry(i*7 + 13) * 1e6) });
    }
  }
  subjCells = cells.filter(c => c.subj);
  backCells = cells.filter(c => !c.subj);

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width  = COLS * CELL_W * dpr;
  canvas.height = ROWS * CELL_H * dpr;
  ctx.scale(dpr, dpr);
  ctx.textBaseline = "top";
  ctx.font = `400 ${FONT}px "Cascadia Code", monospace`;
}

/* per-column rýchlosť driftu pozadia */
const colSpeed = x => 2.5 + mulberry(x*31) * 8;

/* glitch pásy na pozadí: shift = uskočenie nabok, flash = farebný záblesk,
   noise = šumová búrka ignorujúca fotku */
let bgGlitches = [];
function updateBgGlitches(t){
  bgGlitches = bgGlitches.filter(g => t < g.until);
  if (bgGlitches.length < 4 && Math.random() < 0.10){
    const types = ["shift","flash","noise"];
    const y0 = Math.floor(Math.random() * ROWS);
    bgGlitches.push({
      type: types[Math.floor(Math.random() * types.length)],
      y0, y1: y0 + 2 + Math.floor(Math.random() * 7),
      until: t + 0.12 + Math.random() * 0.5,
      shift: (Math.random() < 0.5 ? -1 : 1) * (3 + Math.floor(Math.random() * 9)),
      seed: Math.floor(Math.random() * 1e6)
    });
  }
}

/* ===== render ===== */
function render(t){
  const P = PALETTES[paletteIdx];

  ctx.fillStyle = gradColor(P.bg, t / 18);
  ctx.fillRect(0, 0, COLS*CELL_W, ROWS*CELL_H);

  /* glitch event — občas pár riadkov postavy uskočí nabok */
  if (t > glitch.until && Math.random() < 0.012){
    const r0 = Math.floor(Math.random() * ROWS);
    glitch = { until: t + 0.35, rows: [r0, r0+1, r0+2], shift: (Math.random()<0.5?-1:1) * (2 + Math.floor(Math.random()*3)) };
  }
  const glitchOn = t < glitch.until;
  updateBgGlitches(t);
  /* scanline — svetlá linka bežiaca po pozadí zhora nadol */
  const sweepY = Math.floor((t * 26) % (ROWS + 60)) - 30;

  /* batch podľa farby — málo zmien fillStyle */
  const buckets = new Map();
  const push = (color, x, y, ch) => {
    let b = buckets.get(color);
    if (!b){ b = []; buckets.set(color, b); }
    b.push(x, y, ch);
  };

  for (const c of cells){
    /* "atrament": 1 = najhustejší znak; pri invert paletách kreslí jas fotky */
    const ink0 = P.invert ? c.lum : 1 - c.lum;

    if (c.subj){
      /* POSTAVA — stabilný detail + jemné dýchanie jasu (tvár dýcha menej) */
      const wave = Math.sin(t*0.9 + c.x*0.045 + c.y*0.03) * (c.face ? 0.02 : 0.04);
      /* floor: silueta je vždy vyplnená znakmi, črty kreslia tmavšie oblasti;
         tvár má širší tonálny rozsah nech črty poriadne vystúpia */
      const floor = c.face ? 0.28 : 0.40;
      const ink = Math.min(1, Math.max(0, floor + (1 - floor) * (ink0 + wave)));
      let li = Math.floor((1 - ink) * SUBJ_LEVELS.length);
      li = Math.min(SUBJ_LEVELS.length-1, Math.max(0, li));
      const set = SUBJ_LEVELS[li];
      const ch = set[(c.jit >> 2) % set.length];
      if (ch === " ") continue;
      /* najvýraznejší odtieň tam, kde je najviac atramentu (oči, vlasy, brada) */
      const shade = P.subj[Math.min(4, Math.floor((1 - ink0) * 5))];
      let gx = c.x;
      if (glitchOn && glitch.rows.includes(c.y)) gx += glitch.shift;
      push(shade, gx, c.y, ch);
    } else {
      /* POZADIE — tečie nadol, iné znaky, blikanie; vlastný floor nech je stále textúrované */
      const drift = Math.floor(t * colSpeed(c.x));
      const flow = mulberry(c.x*131 + ((c.y + drift) % ROWS)*17 + c.jit % 7);
      const ink = 0.45 + 0.55 * ink0;
      let li = Math.floor((1 - ink) * BACK_LEVELS.length + flow * 2.2);
      li = Math.min(BACK_LEVELS.length-1, Math.max(0, li));
      let set = BACK_LEVELS[li];
      let ch = set[Math.floor(flow * 4) % set.length];
      let shade = P.back[flow > 0.5 ? 0 : 1];
      let gx = c.x;
      let forced = false;

      /* glitch pásy */
      for (const g of bgGlitches){
        if (c.y < g.y0 || c.y > g.y1) continue;
        if (g.type === "shift"){
          gx = (c.x + g.shift + COLS) % COLS;
          forced = true;
        } else if (g.type === "flash"){
          shade = P.flash;
          forced = true;
        } else { /* noise — hustá búrka znakov nezávislá od fotky */
          const nz = mulberry(c.x*7 + c.y*613 + g.seed + Math.floor(t*30));
          set = BACK_LEVELS[nz < 0.5 ? 0 : 1];
          ch = set[Math.floor(nz * 4) % set.length];
          if (nz > 0.35){ shade = nz > 0.85 ? P.flash : P.back[0]; forced = true; }
        }
      }
      /* scanline zvýrazní znaky, cez ktoré práve prechádza */
      if (Math.abs(c.y - sweepY) <= 1){
        shade = P.flash; forced = true;
      }

      if (ch === " ") continue;
      /* vlna útlmu — časť znakov sa stráca a objavuje (glitch/scanline ju prebijú) */
      if (!forced && Math.sin(t*2.4 + c.y*0.25 + c.x*0.07 + flow*6) < -0.45) continue;
      push(shade, gx, c.y, ch);
    }
  }

  for (const [color, arr] of buckets){
    ctx.fillStyle = color;
    for (let i = 0; i < arr.length; i += 3){
      ctx.fillText(arr[i+2], arr[i]*CELL_W, arr[i+1]*CELL_H);
    }
  }
}

/* scramble: postava pomaly (drží detail), pozadie agresívne */
function scramble(){
  const nS = Math.floor(subjCells.length * 0.002);
  for (let k = 0; k < nS; k++){
    const c = subjCells[Math.floor(Math.random() * subjCells.length)];
    c.jit = Math.floor(Math.random() * 1e6);
  }
  const nB = Math.floor(backCells.length * 0.035);
  for (let k = 0; k < nB; k++){
    const c = backCells[Math.floor(Math.random() * backCells.length)];
    c.jit = Math.floor(Math.random() * 1e6);
  }
}

/* ===== slučka ===== */
let last = 0;
function loop(now){
  if (!paused && now - last >= 1000/FPS){
    const t = now / 1000;
    scramble();
    render(t);
    last = now;
  }
  requestAnimationFrame(loop);
}

canvas.addEventListener("click", () => {
  paletteIdx = (paletteIdx + 1) % PALETTES.length;
});
document.addEventListener("keydown", e => {
  if (e.code === "Space"){ e.preventDefault(); paused = !paused; }
});

/* ===== štart ===== */
const photo = new Image();
const mask = new Image();
let loaded = 0;
const ready = () => {
  if (++loaded < 2) return;
  const start = () => { buildGrid(photo, mask); requestAnimationFrame(loop); };
  if (document.fonts && document.fonts.load){
    document.fonts.load(`400 ${FONT}px "Cascadia Code"`).then(start, start);
  } else start();
};
photo.onload = ready; mask.onload = ready;
photo.src = PHOTO_SRC;
mask.src = MASK_SRC;
</script>
