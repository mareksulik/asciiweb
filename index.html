<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ASCII Gradient – Palette Switch</title>

  <style>
    html,body{
      margin:0;
      background:#fff;
      font-family:"JetBrains Mono","Fira Code",monospace;
    }
    pre#ascii{
      white-space:pre;                    /* zachová presný raster */
      line-height:1.05;
      font-size:14px;
      user-select:none;
      margin:32px;
    }
    #palette{
      position:fixed;
      top:16px; left:16px;
      font-size:14px;
      padding:4px 8px;
    }
  </style>

  <script type="module" src="./app.js"></script>
</head>
<body>
  <select id="palette"></select>
  <pre id="ascii"></pre>
</body>
</html>
